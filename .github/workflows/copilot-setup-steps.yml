name: "Copilot Setup Steps"

# Run automatically when this file changes to validate it, and allow manual
# testing from the repository's Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Build gh CLI
              run: make

            - name: Install gh-skill globally
              run: bin/gh skill install . gh-skill --from-local --agent github-copilot --scope user --force
